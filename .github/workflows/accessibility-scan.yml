name: Accessibility Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  pull-requests: write

concurrency:
  group: accessibility-scan
  cancel-in-progress: false

jobs:
  scan:
    # Auto-Fix opens its own PRs from "ada/fix/*" branches — without this
    # guard, each of those PRs re-triggers this same workflow (pull_request
    # trigger above), which scans again and opens MORE fix-PRs, which
    # trigger more runs... an infinite cascade. This was live on 2026-10-14
    # and created 280+ duplicate PRs before being caught.
    if: ${{ !startsWith(github.head_ref, 'ada/fix/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ADA Tool accessibility scan
        env:
          ADA_API_BASE: ${{ secrets.ADA_API_BASE }}
          ADA_API_KEY: ${{ secrets.ADA_API_KEY }}
          ADA_SITE_URL: https://vinothrajm0407.github.io/ADA-AutoFix-Test-GitHub-2/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/ada-scan.js
